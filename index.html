<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人作品集入口 | Portfolio</title>
    <style>
        /* 基礎全域設定 */
        :root {
            --bg-color: #D12929;
            --card-bg: #F5C9C0;
            --text-main: #22336E;
            --text-sub: #6C769F;
            --teal-accent: #0024B1;       /* 湖水藍 主色 */
            --teal-hover: #862C48;        /* 湖水藍 深色 Hover */
            --teal-light: #F7EBDD;        /* 湖水藍 淡色背景 */
            --locked-bg: #edf2f7;
            --locked-text: #a0aec0;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 880px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: var(--shadow-md);
            text-align: center;
        }

        /* 個人簡介區塊 */
        .profile-section {
            margin-bottom: 36px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--card-bg);
            box-shadow: 0 4px 14px rgba(56, 178, 172, 0.25);
            margin-bottom: 16px;
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
