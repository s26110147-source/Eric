<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帥氣迷因產生器 | Cyber Meme Studio</title>

    <!-- 1. 引入 Google Fonts: Orbitron (科幻帥氣字體) & Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <!-- 2. 引入 html2canvas CDN (將 DOM 轉為圖片下載) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* === 全局變數與帥氣暗黑風配色 === */
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 28, 45, 0.85);
            --accent-cyan: #00f2fe;
            --accent-neon: #4facfe;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --border-glow: rgba(0, 242, 254, 0.3);
            --radius-main: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(79, 172, 254, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 主標題 */
        .app-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        /* 主佈局區塊 (電腦版兩欄，手機版單欄) */
        .workspace {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            align-items: flex-start;
        }

        /* 左側：控制面板 */
        .control-panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-main);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 項目群組標籤 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .input-group label span {
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        /* 輸入框樣式 */
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 14, 23, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        /* 客製化圖片上傳按鈕 */
        .file-upload-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(79, 172, 254, 0.1));
            border: 2px dashed var(--accent-cyan);
            padding: 14px;
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload-btn:hover {
            background: rgba(0, 242, 254, 0.2);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        input[type="file"] {
            display: none;
        }

        /* 滑桿美化 */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* 酷炫下載按鈕 */
        .download-btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-neon));
            border: none;
            border-radius: 8px;
            color: #050811;
            font-size: 1.1rem;
            font-weight: 900;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
        }

        /* 右側：預覽區塊 */
        .preview-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: sticky;
            top: 20px;
        }

        /* 迷因輸出目標容器 (截圖的核心區塊) */
        .meme-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: var(--radius-main);
            overflow: hidden;
            background: #111;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-glow);
            line-height: 0; /* 消除 img 底部的微小空隙 */
        }

        /* 預設提示文字 */
        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-sub);
            font-size: 1rem;
            pointer-events: none;
            text-align: center;
        }

        .meme-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            min-height: 300px;
        }

        /* 迷因文字共通樣式 */
        .meme-text {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #ffffff;
            font-weight: 900;
            font-family: 'Impact', 'Noto Sans TC', sans-serif;
            text-transform: uppercase;
            line-height: 1.2;
            word-wrap: break-word;
            pointer-events: none; /* 避免干擾點擊 */
            
            /* 黑色粗文字描邊 + 陰影效果，確保任何背景都看得清 */
            -webkit-text-stroke: 2px #000000;
            text-shadow: 
                3px 3px 0 #000,
               -3px -3px 0 #000,  
                3px -3px 0 #000,
               -3px  3px 0 #000,
                0px  4px 10px rgba(0, 0, 0, 0.9);
        }

        .top-text {
            top: 5%;
        }

        .bottom-text {
            bottom: 5%;
        }

        /* RWD 響應式：手機版調整 */
        @media (max-width: 768px) {
            .workspace {
                flex-direction: column-reverse; /* 手機上把預覽圖放在最上方 */
            }
            .preview-panel {
                position: relative;
                top: 0;
            }
            .app-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <h1 class="app-title">⚡ CYBER MEME GENERATOR</h1>

    <div class="workspace">

        <!-- ================= 左側：控制面板區 ================= -->
        <div class="control-panel">
            
            <!-- 圖片上傳區塊 -->
            <div class="input-group">
                <label>1. 選擇迷因底圖</label>
                <label for="image-input" class="file-upload-btn">
                    📁 點擊上傳本機圖片
                </label>
                <!-- 隱藏原生檔案輸入框，改用客製按鈕觸發 -->
                <input type="file" id="image-input" accept="image/*">
            </div>

            <!-- 文字輸入區塊 -->
            <div class="input-group">
                <label>2. 上方文字</label>
                <input type="text" id="top-text-input" placeholder="寫點好笑的..." value="當程式碼一次就 RUN 通">
            </div>

            <div class="input-group">
                <label>3. 下方文字</label>
                <input type="text" id="bottom-text-input" placeholder="寫點更狂的..." value="一定是系統出錯了">
            </div>

            <!-- 參數微調滑桿區塊 -->
            <div class="input-group">
                <label>4. 字體大小 <span id="font-size-val">36px</span></label>
                <input type="range" id="font-size-slider" min="16" max="72" value="36">
            </div>

            <div class="input-group">
                <label>5. 上方文字位置 <span id="top-pos-val">5%</span></label>
                <input type="range" id="top-pos-slider" min="0" max="40" value="5">
            </div>

            <div class="input-group">
                <label>6. 下方文字位置 <span id="bottom-pos-val">5%</span></label>
                <input type="range" id="bottom-pos-slider" min="0" max="40" value="5">
            </div>

            <!-- 一鍵下載按鈕 -->
            <button class="download-btn" id="download-btn">🚀 輸出並下載迷因</button>
        </div>

        <!-- ================= 右側：即時預覽區 ================= -->
        <div class="preview-panel">
            <!-- html2canvas 會將這個 .meme-container 轉為圖片 -->
            <div class="meme-container" id="meme-container">
                <div class="placeholder-text" id="placeholder-text">請先上傳一張圖片</div>
                <img id="meme-image" class="meme-img" src="" alt="" style="display: none;">
                <div class="meme-text top-text" id="meme-top-text">當程式碼一次就 RUN 通</div>
                <div class="meme-text bottom-text" id="meme-bottom-text">一定是系統出錯了</div>
            </div>
        </div>

    </div>

    <!-- ================= JavaScript 邏輯區 ================= -->
    <script>
        // DOM 元素抓取
        const imageInput = document.getElementById('image-input');
        const memeImage = document.getElementById('meme-image');
        const placeholderText = document.getElementById('placeholder-text');

        const topTextInput = document.getElementById('top-text-input');
        const bottomTextInput = document.getElementById('bottom-text-input');
        const memeTopText = document.getElementById('meme-top-text');
        const memeBottomText = document.getElementById('meme-bottom-text');

        const fontSizeSlider = document.getElementById('font-size-slider');
        const topPosSlider = document.getElementById('top-pos-slider');
        const bottomPosSlider = document.getElementById('bottom-pos-slider');

        const fontSizeVal = document.getElementById('font-size-val');
        const topPosVal = document.getElementById('top-pos-val');
        const bottomPosVal = document.getElementById('bottom-pos-val');

        const downloadBtn = document.getElementById('download-btn');
        const memeContainer = document.getElementById('meme-container');

        // 預設預設一張示範底圖 (使用 Canvas 動態產生簡單預設背景)
        function initDefaultImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, 600, 400);
            
            memeImage.src = canvas.toDataURL();
            memeImage.style.display = 'block';
            placeholderText.style.display = 'none';
        }
        initDefaultImage();

        // 1. 本機圖片上傳 (FileReader，避免 CORS 錯誤)
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    memeImage.src = event.target.result;
                    memeImage.style.display = 'block';
                    placeholderText.style.display = 'none';
                };
                reader.readAsDataURL(file); // 將圖片讀取為 Base64 URL
            }
        });

        // 2. 即時文字同步輸入
        topTextInput.addEventListener('input', () => {
            memeTopText.innerText = topTextInput.value;
        });

        bottomTextInput.addEventListener('input', () => {
            memeBottomText.innerText = bottomTextInput.value;
        });

        // 3. 字體大小微調
        fontSizeSlider.addEventListener('input', () => {
            const size = fontSizeSlider.value + 'px';
            memeTopText.style.fontSize = size;
            memeBottomText.style.fontSize = size;
            fontSizeVal.innerText = size;
        });

        // 4. 上方文字位置微調
        topPosSlider.addEventListener('input', () => {
            const pos = topPosSlider.value + '%';
            memeTopText.style.top = pos;
            topPosVal.innerText = pos;
        });

        // 5. 下方文字位置微調
        bottomPosSlider.addEventListener('input', () => {
            const pos = bottomPosSlider.value + '%';
            memeBottomText.style.bottom = pos;
            bottomPosVal.innerText = pos;
        });

        // 6. 一鍵截圖並下載圖檔 (使用 html2canvas)
        downloadBtn.addEventListener('click', () => {
            // 變更按鈕狀態
            downloadBtn.innerText = '⌛ 產生圖片中...';
            downloadBtn.style.opacity = '0.7';

            // 使用 html2canvas 將 .meme-container 轉為畫布
            html2canvas(memeContainer, {
                scale: 2, // 提高解析度，讓下載的圖片更清晰
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                // 將 Canvas 轉為下載連結
                const link = document.createElement('a');
                link.download = 'my-meme.png';
                link.href = canvas.toDataURL('image/png');
                link.click();

                // 恢復按鈕狀態
                downloadBtn.innerText = '🚀 輸出並下載迷因';
                downloadBtn.style.opacity = '1';
            }).catch(err => {
                alert('下載失敗，請重新嘗試！');
                console.error(err);
                downloadBtn.innerText = '🚀 輸出並下載迷因';
                downloadBtn.style.opacity = '1';
            });
        });
    </script>
</body>
</html>
